<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubeSat Global Mission Control</title>
    
    <!-- Authentic Aerospace & Mission Control Telemetry Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #000000;
            color: #00f0ff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* High-Clarity Unfiltered Background Video */
        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: none;
        }

        /* Glassmorphic Space Command Interface */
        .hud-container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 880px;
            background: rgba(2, 10, 22, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 240, 255, 0.2);
            overflow: hidden;
        }

        /* Scanlines restricted only inside HUD box */
        .hud-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
        }

        /* HUD Target Reticles */
        .corner-tl, .corner-br {
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: #00f0ff;
            border-style: solid;
            z-index: 3;
        }
        .corner-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 6px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 6px; }

        .hud-content {
            position: relative;
            z-index: 2;
        }

        .hud-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .hud-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.9), 0 0 25px rgba(0, 240, 255, 0.4);
            text-transform: uppercase;
        }

        .hud-header .sub-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.88rem;
            color: #38bdf8;
            letter-spacing: 3px;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Mission State Banner */
        .status-box {
            font-family: 'Share Tech Mono', monospace;
            padding: 14px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 1.18rem;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .normal {
            background: rgba(16, 185, 129, 0.25);
            border: 1.5px solid #10b981;
            color: #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
        }

        .warning {
            background: rgba(239, 68, 68, 0.32);
            border: 1.5px solid #ef4444;
            color: #ff8888;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.85);
            animation: pulse-alert 0.8s infinite alternate;
        }

        .eclipse {
            background: rgba(168, 85, 247, 0.32);
            border: 1.5px solid #a855f7;
            color: #e9d5ff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        @keyframes pulse-alert {
            0% { opacity: 0.7; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            100% { opacity: 1; box-shadow: 0 0 35px rgba(239, 68, 68, 0.95); }
        }

        /* Telemetry Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 16px;
        }

        .card {
            background: rgba(3, 14, 33, 0.92);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            padding: 18px 10px;
            text-align: center;
            position: relative;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 240, 255, 0.9);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
        }

        .card h3 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #a5f3fc;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .unit {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            color: #00f0ff;
            margin-left: 2px;
        }
    </style>
</head>
<body>
    <!-- Clean Unfiltered Looping Video -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="background1.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <!-- Main Telemetry Interface -->
    <div class="hud-container">
        <div class="corner-tl"></div>
        <div class="corner-br"></div>

        <div class="hud-content">
            <div class="hud-header">
                <h1>CUBESAT MISSION CONTROL</h1>
                <div class="sub-text">SATELLITE TELEMETRY LINK // ORBITAL STATION</div>
            </div>

            <div id="status-banner" class="status-box normal">SYSTEM NOMINAL</div>

            <div class="grid">
                <div class="card"><h3>Pitch</h3><p><span id="pitch">0.0</span><span class="unit">&deg;</span></p></div>
                <div class="card"><h3>Roll</h3><p><span id="roll">0.0</span><span class="unit">&deg;</span></p></div>
                <div class="card"><h3>Temp</h3><p><span id="temp">0.0</span><span class="unit">&deg;C</span></p></div>
                <div class="card"><h3>Humidity</h3><p><span id="hum">0.0</span><span class="unit">%</span></p></div>
                <div class="card"><h3>Sun Level</h3><p><span id="ldr">0</span></p></div>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://cubesat-telemetry-a99a4-default-rtdb.firebaseio.com/";

        setInterval(() => {
            fetch(FIREBASE_URL)
            .then(res => res.json())
            .then(data => {
                if(!data) return;
                document.getElementById('pitch').innerText = Number(data.pitch || 0).toFixed(1);
                document.getElementById('roll').innerText = Number(data.roll || 0).toFixed(1);
                document.getElementById('temp').innerText = Number(data.temp || 0).toFixed(1);
                document.getElementById('hum').innerText = Number(data.hum || 0).toFixed(1);
                document.getElementById('ldr').innerText = data.ldr ?? 0;

                let banner = document.getElementById('status-banner');
                if (data.tumbling) {
                    banner.innerText = 'CRITICAL ALERT: HIGH TUMBLE RATE';
                    banner.className = 'status-box warning';
                } else if (data.eclipse) {
                    banner.innerText = 'STATE: ECLIPSE MODE (LOW LIGHT)';
                    banner.className = 'status-box eclipse';
                } else {
                    banner.innerText = 'SYSTEM NOMINAL (SUN TRACKING)';
                    banner.className = 'status-box normal';
                }
            }).catch(e => console.log("Firebase Connection Error:", e));
        }, 800);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubeSat Global Mission Control</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #020617;
            color: #00f0ff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            transform: translateZ(0);
            will-change: transform;
            opacity: 0.6;
        }

        .hud-container {
            position: relative;
            z-index: 2;
            width: 94%;
            max-width: 950px;
            background: rgba(2, 10, 22, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 240, 255, 0.2);
            overflow: hidden;
        }

        .hud-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
        }

        .corner-tl, .corner-br {
            position: absolute;
            width: 22px; height: 22px;
            border-color: #00f0ff;
            border-style: solid;
            z-index: 3;
        }
        .corner-tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 6px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 6px; }

        .hud-content { position: relative; z-index: 2; }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }

        .hud-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.9);
            text-transform: uppercase;
        }

        .hud-header .clock-box {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            letter-spacing: 2px;
            text-align: right;
        }

        .status-box {
            font-family: 'Share Tech Mono', monospace;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .normal {
            background: rgba(16, 185, 129, 0.2);
            border: 1.5px solid #10b981;
            color: #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .warning {
            background: rgba(239, 68, 68, 0.3);
            border: 1.5px solid #ef4444;
            color: #ff8888;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.85);
            animation: pulse-alert 0.6s infinite alternate;
        }

        .eclipse {
            background: rgba(168, 85, 247, 0.3);
            border: 1.5px solid #a855f7;
            color: #e9d5ff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        @keyframes pulse-alert {
            0% { opacity: 0.6; transform: scale(0.99); }
            100% { opacity: 1; transform: scale(1.01); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(3, 14, 33, 0.92);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            padding: 14px 8px;
            text-align: center;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 240, 255, 0.9);
        }

        .card h3 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: #a5f3fc;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 6px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .unit {
            font-size: 0.85rem;
            color: #00f0ff;
            margin-left: 2px;
        }

        /* Interactive Avionics Horizon Gauge Canvas */
        .visualizer-row {
            display: flex;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 8px;
            padding: 12px;
        }

        .viz-box {
            flex: 1;
            text-align: center;
        }

        .viz-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        canvas {
            background: #000;
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="background1.mp4" type="video/mp4">
    </video>

    <div class="hud-container">
        <div class="corner-tl"></div>
        <div class="corner-br"></div>

        <div class="hud-content">
            <div class="hud-header">
                <div>
                    <h1>CUBESAT MISSION CONTROL</h1>
                    <div style="font-family:'Share Tech Mono'; font-size:0.8rem; color:#38bdf8; letter-spacing:2px;">ORBITAL TELEMETRY LINK // ESP32 GROUND STATION</div>
                </div>
                <div class="clock-box">
                    <div id="utc-clock">00:00:00 UTC</div>
                    <div id="link-status" style="color:#10b981;">LINK ACTIVE</div>
                </div>
            </div>

            <div id="status-banner" class="status-box normal">SYSTEM NOMINAL</div>

            <div class="grid">
                <div class="card"><h3>Pitch</h3><p><span id="pitch">0.0</span><span class="unit">&deg;</span></p></div>
                <div class="card"><h3>Roll</h3><p><span id="roll">0.0</span><span class="unit">&deg;</span></p></div>
                <div class="card"><h3>Temp</h3><p><span id="temp">0.0</span><span class="unit">&deg;C</span></p></div>
                <div class="card"><h3>Humidity</h3><p><span id="hum">0.0</span><span class="unit">%</span></p></div>
                <div class="card"><h3>Sun Level</h3><p><span id="ldr">0</span></p></div>
            </div>

            <!-- Dynamic Graphical Telemetry Widgets -->
            <div class="visualizer-row">
                <div class="viz-box">
                    <div class="viz-title">ATTITUDE INDICATOR (GYRO)</div>
                    <canvas id="horizonCanvas" width="100" height="100"></canvas>
                </div>
                <div class="viz-box">
                    <div class="viz-title">RADAR SWEEP</div>
                    <canvas id="radarCanvas" width="100" height="100"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://cubesat-telemetry-a99a4-default-rtdb.firebaseio.com/telemetry.json";
        
        // Live UTC Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4] + " UTC";
        }, 1000);

        // Sound Generator
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 600) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // Canvas 1: Artificial Horizon ADI Gauge
        const hCanvas = document.getElementById('horizonCanvas');
        const hCtx = hCanvas.getContext('2d');
        
        function drawHorizon(pitch, roll) {
            hCtx.clearRect(0, 0, 100, 100);
            hCtx.save();
            hCtx.translate(50, 50);
            hCtx.rotate((roll * Math.PI) / 180);

            // Sky & Ground
            hCtx.fillStyle = '#0284c7';
            hCtx.fillRect(-50, -50 + pitch, 100, 50);
            hCtx.fillStyle = '#b45309';
            hCtx.fillRect(-50, pitch, 100, 50);

            // Horizon Line
            hCtx.strokeStyle = '#ffffff';
            hCtx.lineWidth = 2;
            hCtx.beginPath();
            hCtx.moveTo(-50, pitch);
            hCtx.lineTo(50, pitch);
            hCtx.stroke();
            hCtx.restore();

            // Fixed Reference Crosshair
            hCtx.strokeStyle = '#00f0ff';
            hCtx.lineWidth = 2;
            hCtx.beginPath();
            hCtx.moveTo(35, 50); hCtx.lineTo(65, 50);
            hCtx.moveTo(50, 35); hCtx.lineTo(50, 65);
            hCtx.stroke();
        }

        // Canvas 2: Radar Sweep Animation
        const rCanvas = document.getElementById('radarCanvas');
        const rCtx = rCanvas.getContext('2d');
        let angle = 0;

        function drawRadar() {
            rCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            rCtx.fillRect(0, 0, 100, 100);

            // Concentric Rings
            rCtx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
            rCtx.beginPath();
            rCtx.arc(50, 50, 20, 0, Math.PI * 2);
            rCtx.arc(50, 50, 40, 0, Math.PI * 2);
            rCtx.stroke();

            // Rotating Sweep
            rCtx.strokeStyle = '#00f0ff';
            rCtx.beginPath();
            rCtx.moveTo(50, 50);
            rCtx.lineTo(50 + 45 * Math.cos(angle), 50 + 45 * Math.sin(angle));
            rCtx.stroke();

            angle += 0.05;
            requestAnimationFrame(drawRadar);
        }
        drawRadar();

        // Main Fetch Loop
        setInterval(() => {
            fetch(FIREBASE_URL)
            .then(res => res.json())
            .then(data => {
                if (!data) return;

                const pitchVal = Number(data.pitch || 0);
                const rollVal = Number(data.roll || 0);

                document.getElementById('pitch').innerText = pitchVal.toFixed(1);
                document.getElementById('roll').innerText = rollVal.toFixed(1);
                document.getElementById('temp').innerText = Number(data.temp || 0).toFixed(1);
                document.getElementById('hum').innerText = Number(data.hum || 0).toFixed(1);
                document.getElementById('ldr').innerText = data.ldr ?? 0;

                drawHorizon(pitchVal, rollVal);

                let banner = document.getElementById('status-banner');
                const isTumbling = (data.tumbling === true || data.tumbling === "true");
                const isEclipse = (data.eclipse === true || data.eclipse === "true");

                if (isTumbling) {
                    banner.innerText = 'CRITICAL ALERT: HIGH TUMBLE RATE';
                    banner.className = 'status-box warning';
                    playBeep(900);
                } else if (isEclipse) {
                    banner.innerText = 'STATE: ECLIPSE MODE (LOW LIGHT)';
                    banner.className = 'status-box eclipse';
                } else {
                    banner.innerText = 'SYSTEM NOMINAL (SUN TRACKING)';
                    banner.className = 'status-box normal';
                }
            }).catch(e => {
                document.getElementById('link-status').innerText = "LINK DISCONNECTED";
                document.getElementById('link-status').style.color = "#ef4444";
            });
        }, 800);
    </script>
</body>
</html>
